name: Sync to Hugging Face Space

on:
  push:
    branches: [main, firstcommit]
  workflow_dispatch:

jobs:
  sync-to-hf-space:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git push https://umutcan1401:${HF_TOKEN}@huggingface.co/spaces/umutcan1401/dockeraifridge HEAD:main
